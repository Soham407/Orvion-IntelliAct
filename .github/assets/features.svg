<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="feat-title feat-desc">
  <title id="feat-title">Orvion IntelliAct Feature Capabilities</title>
  <desc id="feat-desc">Overview of platform capabilities: Control &amp; Safety Systems, Employee Document Vault, SMTP Career Mailer, and E2E Test Suite.</desc>

  <defs>
    <linearGradient id="feat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="16" fill="url(#feat-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Feature Card 1: Industrial Hardware & Software Catalog -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="262" height="164" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" />
    <!-- Icon representation -->
    <circle cx="32" cy="32" r="7" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 32 21 L 32 27 M 32 37 L 32 43 M 21 32 L 27 32 M 37 32 L 43 32" stroke="#38bdf8" stroke-width="2" />
    
    <text x="60" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Industrial ICSS &amp; SIL-3</text>
    <text x="16" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Control &amp; Safety Catalog</text>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">DCS (ECS-700, JX-300XP), SCADA (Supcon InPlant), SIL-3 Safety PLCs (TCS-900), and PLCs (GCS-G3/G5).</text>
    <text x="16" y="145" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">lib/products-data.js</text>
  </g>

  <!-- Feature Card 2: Secure Employee Portal & Documents -->
  <g transform="translate(320, 28)">
    <rect x="0" y="0" width="262" height="164" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#4f46e5" fill-opacity="0.2" />
    <!-- Lock Icon -->
    <rect x="25" y="29" width="14" height="11" rx="2" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M 28 29 L 28 25 C 28 22.5 36 22.5 36 25 L 36 29" fill="none" stroke="#818cf8" stroke-width="2" />

    <text x="60" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Employee Portal</text>
    <text x="16" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Secure Document Vault</text>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Protected JWT session cookies (8h max age), scrypt password hashing, Supabase RLS policies, and document upload/download.</text>
    <text x="16" y="145" fill="#818cf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">app/employee-portal · lib/auth.js</text>
  </g>

  <!-- Feature Card 3: Nodemailer Careers SMTP Pipeline -->
  <g transform="translate(608, 28)">
    <rect x="0" y="0" width="262" height="164" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#059669" fill-opacity="0.2" />
    <!-- Mail Icon -->
    <rect x="23" y="25" width="18" height="14" rx="2" fill="none" stroke="#34d399" stroke-width="2" />
    <path d="M 23 27 L 32 33 L 41 27" stroke="#34d399" stroke-width="2" fill="none" />

    <text x="60" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Careers &amp; Resume Mailer</text>
    <text x="16" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Automated Job Applications</text>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Nodemailer integration accepting PDF/DOC/DOCX resumes, streaming arrayBuffer attachments to HR.</text>
    <text x="16" y="145" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">app/api/careers/apply</text>
  </g>

  <!-- Feature Card 4: Testing & Verification Pipeline -->
  <g transform="translate(896, 28)">
    <rect x="0" y="0" width="272" height="164" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#d97706" fill-opacity="0.2" />
    <!-- Checkmark Badge Icon -->
    <path d="M 24 32 L 29 37 L 40 25" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="60" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">E2E &amp; Unit Test Suite</text>
    <text x="16" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Automated Quality Gates</text>
    <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Playwright integration testing for browser routes and native Node test runner (`node --test`) for unit validation.</text>
    <text x="16" y="145" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">tests/*.test.mjs · playwright</text>
  </g>
</svg>
