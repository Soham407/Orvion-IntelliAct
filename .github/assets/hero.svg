<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Orvion IntelliAct - Industrial Automation &amp; Enterprise Platform</title>
  <desc id="hero-desc">Next.js 16 web application for industrial automation, SIL-3 safety systems, dual-layer database architecture, and secure employee portal.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="400" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="400" rx="20" fill="url(#dot-grid)" />

  <!-- Accent glow shapes -->
  <circle cx="1000" cy="80" r="180" fill="#0284c7" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="200" cy="320" r="160" fill="#6366f1" fill-opacity="0.06" filter="blur(40px)" />

  <!-- LEFT COLUMN: TITLE & IDENTITY -->
  <g id="title-block" transform="translate(56, 44)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INDUSTRIAL AUTOMATION PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="76" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">Orvion IntelliAct</text>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">ICSS, DCS &amp; SIL-3 Safety Systems Web Platform</text>
    <text x="0" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Enterprise Next.js 16 App Router · Dual DB Strategy · Employee Portal</text>

    <!-- Key Spec Badges -->
    <g transform="translate(0, 162)">
      <!-- Badge 1: Next.js 16 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Next.js 16 + React 19</text>

      <!-- Badge 2: Dual DB -->
      <rect x="145" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Supabase RLS / MySQL DB</text>

      <!-- Badge 3: Auth -->
      <rect x="320" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="332" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">JWT Cookie Auth Portal</text>
    </g>

    <!-- Quick Start Command Card -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="465" height="88" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <!-- Terminal Controls -->
      <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8" />
      <circle cx="34" cy="18" r="4" fill="#f59e0b" opacity="0.8" />
      <circle cx="48" cy="18" r="4" fill="#10b981" opacity="0.8" />
      <text x="64" y="22" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">terminal — quickstart</text>
      
      <!-- Command prompt line -->
      <text x="20" y="52" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">$</text>
      <text x="36" y="52" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npm install &amp;&amp; npm run dev</text>
      <text x="20" y="73" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Starts local server at http://localhost:3000</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: SYSTEM TOPOLOGY VISUAL -->
  <g id="system-topology" transform="translate(560, 36)">
    <!-- Main Panel Container -->
    <rect x="0" y="0" width="584" height="328" rx="14" fill="url(#panel-grad)" stroke="#334155" stroke-width="1.5" />

    <!-- Panel Header -->
    <rect x="0" y="0" width="584" height="38" rx="14" fill="#1e293b" fill-opacity="0.8" />
    <!-- Round top corners manually clipped visually -->
    <rect x="0" y="24" width="584" height="14" fill="#1e293b" fill-opacity="0.8" />
    <text x="20" y="24" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.8">SYSTEM ARCHITECTURE &amp; DATA FLOW</text>
    <circle cx="556" cy="19" r="4" fill="#10b981" />
    <text x="500" y="23" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">ONLINE</text>

    <!-- Node 1: Next.js App Router Core -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="544" height="64" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="14" y="14" width="36" height="36" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
      <!-- Next.js logo representation -->
      <text x="24" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">N</text>
      <text x="62" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Next.js 16 App Router &amp; API Layer</text>
      <text x="62" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Products · Solutions · Employee Portal · Careers SMTP Mailer</text>
    </g>

    <!-- Connecting Arrows -->
    <path d="M 150 120 L 150 142" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M 430 120 L 430 142" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Node 2A: Database Strategy -->
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="260" height="76" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">SUPABASE DATABASE</text>
      <text x="14" y="43" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Document Vault &amp; Portal Auth</text>
      <text x="14" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Row Level Security (RLS) Enabled</text>
    </g>

    <!-- Node 2B: Hostinger MySQL Fallback -->
    <g transform="translate(304, 144)">
      <rect x="0" y="0" width="260" height="76" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#818cf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">HOSTINGER MYSQL / MOCK</text>
      <text x="14" y="43" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Auto-Migration Engine</text>
      <text x="14" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">db-mock.json automatic payload</text>
    </g>

    <!-- Node 3: Industrial Solution Coverage -->
    <g transform="translate(20, 234)">
      <rect x="0" y="0" width="544" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.5">INDUSTRIAL VERTICALS &amp; SYSTEMS</text>
      
      <!-- Tags -->
      <g transform="translate(14, 34)">
        <!-- Tag SIL-3 -->
        <rect x="0" y="0" width="105" height="24" rx="4" fill="#7c2d12" fill-opacity="0.4" stroke="#f97316" stroke-width="1" />
        <text x="8" y="16" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">SIL-3 Safety PLC</text>

        <!-- Tag DCS -->
        <rect x="115" y="0" width="95" height="24" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" />
        <text x="123" y="16" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">ECS-700 DCS</text>

        <!-- Tag SCADA -->
        <rect x="220" y="0" width="105" height="24" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
        <text x="228" y="16" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">InPlant SCADA</text>

        <!-- Tag Terminal Auto -->
        <rect x="335" y="0" width="180" height="24" rx="4" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="1" />
        <text x="343" y="16" fill="#c7d2fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">Refinery &amp; Terminal ICSS</text>
      </g>
    </g>
  </g>
</svg>
